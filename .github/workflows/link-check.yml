name: Link Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/docs/**'
  schedule:
    # Weekly Monday morning — catch link rot between PRs
    - cron: '17 8 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            -vv
            --config .lychee.toml
            "src/content/docs/**/*.md"
            "src/content/docs/**/*.mdx"
          # Use GITHUB_TOKEN to avoid rate limits on github.com links
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true

  notify:
    needs: check-links
    if: ${{ always() && needs.check-links.result == 'failure' && github.event_name == 'schedule' }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Notify on scheduled run failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Link check: broken links detected';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-rot',
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The weekly link check found broken links.\n\nSee the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
                labels: ['link-rot'],
              });
            }
